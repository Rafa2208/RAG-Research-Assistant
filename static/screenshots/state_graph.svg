<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" width="700" height="640" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#6b6b66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="700" height="640" fill="#ffffff"/>

  <!-- Connectors -->
  <g stroke="#6b6b66" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="90" x2="240" y2="128"/>
    <line x1="240" y1="218" x2="240" y2="256"/>
    <line x1="240" y1="346" x2="240" y2="384"/>
    <line x1="240" y1="474" x2="240" y2="532"/>
    <!-- No branch -->
    <line x1="352" y1="429" x2="440" y2="429"/>
    <!-- Rewrite back to Retrieve -->
    <path d="M530 384 L530 173 L352 173"/>
  </g>

  <!-- Labels -->
  <text x="396" y="418" font-size="13" fill="#6b6b66" text-anchor="middle">No</text>
  <text x="254" y="507" font-size="13" fill="#6b6b66">Yes</text>

  <!-- User question -->
  <rect x="128" y="40" width="224" height="50" rx="8" fill="#f1efe8" stroke="#8a8880" stroke-width="1"/>
  <text x="240" y="70" font-size="15" font-weight="500" fill="#3d3d3a" text-anchor="middle">User question</text>

  <!-- Retrieve -->
  <rect x="128" y="128" width="224" height="90" rx="8" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="1"/>
  <text x="240" y="168" font-size="16" font-weight="500" fill="#085041" text-anchor="middle">Retrieve</text>
  <text x="240" y="192" font-size="13" fill="#0f6e56" text-anchor="middle">FAISS + BM25</text>

  <!-- Rerank -->
  <rect x="128" y="256" width="224" height="90" rx="8" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="1"/>
  <text x="240" y="296" font-size="16" font-weight="500" fill="#085041" text-anchor="middle">Rerank</text>
  <text x="240" y="320" font-size="13" fill="#0f6e56" text-anchor="middle">CrossEncoder</text>

  <!-- Good results? -->
  <rect x="128" y="384" width="224" height="90" rx="8" fill="#faece7" stroke="#f0997b" stroke-width="1"/>
  <text x="240" y="435" font-size="16" font-weight="500" fill="#712b13" text-anchor="middle">Good results?</text>

  <!-- Rewrite query -->
  <rect x="440" y="384" width="180" height="90" rx="8" fill="#faece7" stroke="#f0997b" stroke-width="1"/>
  <text x="530" y="435" font-size="16" font-weight="500" fill="#712b13" text-anchor="middle">Rewrite query</text>

  <!-- Generate answer -->
  <rect x="128" y="532" width="224" height="90" rx="8" fill="#e1f5ee" stroke="#5dcaa5" stroke-width="1"/>
  <text x="240" y="572" font-size="16" font-weight="500" fill="#085041" text-anchor="middle">Generate answer</text>
  <text x="240" y="596" font-size="13" fill="#0f6e56" text-anchor="middle">LLaMA 3.1 via Groq</text>
</svg>
